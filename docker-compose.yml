# cp .env.example .env
# docker compose up -d --build
#
# SQLite database lives in named volume "telegroup-data"
services:
  chatbot:
    build:
      context: .
      dockerfile: AP-Master.Server/Dockerfile
      args:
        VITE_API_MODE: live
    image: telegroup-chatbot:latest
    container_name: telegroup-chatbot
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      AI__ApiKey: ${AI_API_KEY:-}
      AI__Model: ${AI_MODEL:-openrouter/free}
    volumes:
      - telegroup-data:/app/data
    restart: unless-stopped

volumes:
  telegroup-data:
