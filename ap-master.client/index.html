<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Telegroup Customer Support</title>
    <script>
      // Pick the theme before first paint so a dark-theme user never sees the light page flash.
      // Mirrors resolveTheme() in src/lib/theme.ts: a saved choice wins, otherwise the system setting.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('telegroup-theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
